<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liege Harbor District — Island Kingdom</title>
<link rel="stylesheet" href="static/css/map.css">
</head>
<body>

<h1>Liege — Harbor District</h1>
<p class="sub">Part 2 · The Walk to the Docks · Hover locations and persons for detail</p>

<div id="mc">
<svg viewBox="0 0 900 820" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="cb" patternUnits="userSpaceOnUse" width="8" height="8">
    <rect width="8" height="8" fill="#1e1a14"/>
    <rect x="0" y="0" width="3" height="3" fill="#201c16" rx="0.5"/>
    <rect x="4" y="4" width="3" height="3" fill="#1c1812" rx="0.5"/>
  </pattern>
  <pattern id="wp" patternUnits="userSpaceOnUse" width="20" height="10">
    <rect width="20" height="10" fill="#0a1420"/>
    <line x1="0" y1="3" x2="20" y2="3" stroke="#0d1a2a" stroke-width="1"/>
    <line x1="0" y1="7" x2="20" y2="7" stroke="#0c1828" stroke-width="0.5"/>
  </pattern>
  <pattern id="pw" patternUnits="userSpaceOnUse" width="6" height="20">
    <rect width="6" height="20" fill="#141c1e"/>
    <line x1="3" y1="0" x2="3" y2="20" stroke="#101618" stroke-width="0.5"/>
  </pattern>
  <filter id="gp">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- background -->
<rect width="900" height="820" fill="#12100c"/>
<text x="450" y="16" class="lbl-compass">NORTH — CITY</text>
<text x="450" y="810" class="lbl-compass">SOUTH — HARBOR WATER</text>

<!-- harbor approach road -->
<rect x="405" y="22" width="90" height="468" fill="url(#cb)"/>
<line x1="405" y1="22" x2="405" y2="490" stroke="#2a2418" stroke-width="1"/>
<line x1="495" y1="22" x2="495" y2="490" stroke="#2a2418" stroke-width="1"/>
<text x="340" y="34" class="lbl-side">WEST SIDE</text>
<text x="560" y="34" class="lbl-side">EAST SIDE</text>

<!-- ROW 1: Chandler's Row (WEST) + Customs House (EAST) -->
<rect x="255" y="42" width="150" height="95" class="bld-commerce" rx="2"/>
<text x="330" y="87" class="lbl">CHANDLER'S ROW</text>
<text x="330" y="99" class="lbl lbl-sm">rope · oil · sailcloth · oakum</text>

<rect x="530" y="42" width="165" height="95" class="bld-govt" rx="2"/>
<line x1="558" y1="42" x2="558" y2="24" stroke="#504030" stroke-width="1"/>
<line x1="578" y1="42" x2="578" y2="22" stroke="#504030" stroke-width="1"/>
<line x1="598" y1="42" x2="598" y2="26" stroke="#504030" stroke-width="1"/>
<rect x="558" y="24" width="13" height="6" fill="#7a6030" opacity="0.8"/>
<rect x="578" y="22" width="13" height="6" fill="#506030" opacity="0.8"/>
<rect x="598" y="26" width="13" height="6" fill="#605030" opacity="0.8"/>
<text x="612" y="87" class="lbl">CUSTOMS HOUSE</text>
<text x="612" y="99" class="lbl lbl-sm">three flags · always watching</text>
<line x1="405" y1="89" x2="530" y2="89" stroke="#302818" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- ROW 2: Naval Registry (WEST) + Anchor & Compass (EAST) -->
<rect x="265" y="172" width="140" height="88" class="bld-govt" rx="2"/>
<text x="335" y="214" class="lbl">NAVAL REGISTRY</text>
<text x="335" y="226" class="lbl lbl-sm">all vessels logged here</text>

<rect x="530" y="172" width="155" height="88" class="bld-tavern" rx="2"/>
<text x="607" y="214" class="lbl">ANCHOR &amp; COMPASS</text>
<text x="607" y="226" class="lbl lbl-sm">tavern · Fenn's contact point</text>
<line x1="405" y1="216" x2="530" y2="216" stroke="#302818" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- ROW 3: Fish Market (spans full road) -->
<rect x="238" y="296" width="424" height="68" class="bld-market" rx="1"/>
<line x1="278" y1="296" x2="278" y2="364" stroke="#404828" stroke-width="0.5"/>
<line x1="338" y1="296" x2="338" y2="364" stroke="#404828" stroke-width="0.5"/>
<line x1="398" y1="296" x2="398" y2="364" stroke="#404828" stroke-width="0.5"/>
<line x1="458" y1="296" x2="458" y2="364" stroke="#404828" stroke-width="0.5"/>
<line x1="518" y1="296" x2="518" y2="364" stroke="#404828" stroke-width="0.5"/>
<line x1="578" y1="296" x2="578" y2="364" stroke="#404828" stroke-width="0.5"/>
<line x1="622" y1="296" x2="622" y2="364" stroke="#404828" stroke-width="0.5"/>
<text x="450" y="328" class="lbl">FISH MARKET</text>
<text x="450" y="340" class="lbl lbl-sm">spans full road · darker cobbles · always wet</text>

<!-- ROW 4: Pastry Stand (EAST) -->
<rect x="530" y="400" width="82" height="54" class="bld-vendor" rx="2"/>
<text x="571" y="425" class="lbl">PASTRY STAND</text>
<text x="571" y="437" class="lbl lbl-sm">sightline to arch</text>

<!-- Harbor Entrance Arch -->
<rect x="388" y="488" width="124" height="28" class="bld-arch" rx="3"/>
<path d="M388,488 Q450,476 512,488" fill="none" stroke="#c09040" stroke-width="1.5"/>
<text x="450" y="507" class="lbl" style="fill:#c09040">HARBOR ENTRANCE ARCH</text>

<!-- water -->
<rect x="0" y="528" width="900" height="292" fill="url(#wp)"/>

<!-- dock road -->
<rect x="58" y="528" width="784" height="34" class="dock-road"/>
<line x1="58" y1="528" x2="842" y2="528" stroke="#1e2830" stroke-width="1"/>
<line x1="58" y1="562" x2="842" y2="562" stroke="#1e2830" stroke-width="1"/>
<text x="720" y="548" class="lbl-side" style="fill:#304050">DOCK ROAD — EAST ENTRY</text>
<text x="120" y="548" class="lbl-side" style="fill:#304050">WEST END</text>
<rect x="418" y="516" width="64" height="14" fill="#1a1810"/>

<!-- Near Pier -->
<rect x="638" y="388" width="84" height="142" fill="url(#pw)" rx="1"/>
<rect x="638" y="388" width="84" height="142" class="bld-pier" rx="1" fill="none"/>
<text x="680" y="445" class="lbl" style="fill:#406070">NEAR PIER</text>
<text x="680" y="457" class="lbl lbl-sm" style="fill:#304858">fishing · coastal traders</text>
<rect x="646" y="526" width="68" height="6" fill="#1e3040"/>

<!-- Middle Pier -->
<rect x="428" y="348" width="104" height="182" fill="url(#pw)" rx="1"/>
<rect x="428" y="348" width="104" height="182" class="bld-pier" rx="1" fill="none"/>
<text x="480" y="412" class="lbl" style="fill:#406070">MIDDLE PIER</text>
<text x="480" y="424" class="lbl lbl-sm" style="fill:#304858">naval cutters · merchant sloop</text>
<text x="480" y="436" class="lbl lbl-sm" style="fill:#304858">brigantine · covered vessel</text>
<rect x="436" y="526" width="88" height="6" fill="#1e3040"/>

<!-- Far Pier -->
<rect x="158" y="308" width="114" height="222" fill="url(#pw)" rx="1"/>
<rect x="158" y="308" width="114" height="222" class="bld-pier-old" rx="1" fill="none"/>
<line x1="158" y1="428" x2="272" y2="428" stroke="#304858" stroke-width="1" stroke-dasharray="4 2"/>
<text x="215" y="362" class="lbl" style="fill:#305868">FAR PIER</text>
<text x="215" y="374" class="lbl lbl-sm" style="fill:#204050">older stone · corroded iron</text>
<text x="215" y="440" class="lbl lbl-sm" style="fill:#204050">old / new join</text>
<rect x="166" y="526" width="98" height="6" fill="#1a2830"/>

<!-- Hound's Dream -->
<ellipse cx="215" cy="292" rx="50" ry="17" class="bld-vessel"/>
<line x1="215" y1="275" x2="215" y2="248" stroke="#304050" stroke-width="1.5"/>
<circle cx="215" cy="248" r="5" fill="#3a1060" opacity="0.8" filter="url(#gp)"/>
<text x="215" y="334" class="lbl" style="fill:#305060">HOUND'S DREAM</text>
<text x="215" y="346" class="lbl lbl-sm" style="fill:#204050">Fenn's vessel · ready to leave</text>

<!-- Buried Gate Chamber -->
<rect x="166" y="598" width="98" height="62" class="bld-gate" rx="2"/>
<circle cx="215" cy="629" r="15" fill="none" stroke="#6030a0" stroke-width="1" opacity="0.6"/>
<line x1="215" y1="614" x2="215" y2="644" stroke="#6030a0" stroke-width="0.8" opacity="0.5"/>
<line x1="200" y1="629" x2="230" y2="629" stroke="#6030a0" stroke-width="0.8" opacity="0.5"/>
<text x="215" y="672" class="lbl" style="fill:#6030a0">BURIED GATE CHAMBER</text>
<text x="215" y="684" class="lbl lbl-sm" style="fill:#401870">pre-Alliance · dormant transit gate</text>
<line x1="215" y1="563" x2="215" y2="596" stroke="#401870" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

<!-- Person dots -->
<g class="pdot" data-char="commodore_aldric_fenn">
  <circle cx="246" cy="318" r="5" class="dot-ally"/>
  <text x="246" y="321" style="font-size:6px;fill:#40a040;text-anchor:middle;pointer-events:none;dominant-baseline:middle">F</text>
</g>
<g class="pdot" data-char="mira_solt">
  <circle cx="428" cy="478" r="5" class="dot-threat"/>
  <text x="428" y="481" style="font-size:6px;fill:#c03030;text-anchor:middle;pointer-events:none;dominant-baseline:middle">M</text>
</g>
<g class="pdot" data-char="brothers_kael">
  <circle cx="462" cy="544" r="5" class="dot-threat"/>
  <text x="462" y="547" style="font-size:6px;fill:#c03030;text-anchor:middle;pointer-events:none;dominant-baseline:middle">K</text>
</g>
<g class="pdot" data-char="harwick_dray">
  <circle cx="502" cy="418" r="5" class="dot-neutral"/>
  <text x="502" y="421" style="font-size:6px;fill:#c0c040;text-anchor:middle;pointer-events:none;dominant-baseline:middle">D</text>
</g>
<g class="pdot" data-char="broadsheet_man">
  <circle cx="529" cy="193" r="5" class="dot-unknown"/>
  <text x="529" y="196" style="font-size:6px;fill:#8080c0;text-anchor:middle;pointer-events:none;dominant-baseline:middle">?</text>
</g>
<g class="pdot" data-char="dockworker_handcart">
  <circle cx="405" cy="124" r="5" class="dot-bg"/>
  <text x="405" y="127" style="font-size:6px;fill:#908060;text-anchor:middle;pointer-events:none;dominant-baseline:middle">W</text>
</g>
<g class="pdot" data-char="pastry_vendor">
  <circle cx="529" cy="424" r="5" class="dot-bg"/>
  <text x="529" y="427" style="font-size:6px;fill:#908060;text-anchor:middle;pointer-events:none;dominant-baseline:middle">P</text>
</g>
<g class="pdot" data-char="callo_vesh">
  <circle cx="619" cy="114" r="5" class="dot-threat"/>
  <text x="619" y="117" style="font-size:6px;fill:#c03030;text-anchor:middle;pointer-events:none;dominant-baseline:middle">C</text>
</g>
<g class="pdot" data-char="sable_mourne">
  <circle cx="265" cy="193" r="5" class="dot-unknown"/>
  <text x="265" y="196" style="font-size:6px;fill:#8080c0;text-anchor:middle;pointer-events:none;dominant-baseline:middle">S</text>
</g>

<!-- Location hit areas -->
<rect x="255" y="42" width="150" height="95" class="loc-hit" data-loc="liege_chandlers_row"/>
<rect x="530" y="42" width="165" height="95" class="loc-hit" data-loc="liege_customs_house"/>
<rect x="265" y="172" width="140" height="88" class="loc-hit" data-loc="liege_naval_registry"/>
<rect x="530" y="172" width="155" height="88" class="loc-hit" data-loc="liege_anchor_compass"/>
<rect x="238" y="296" width="424" height="68" class="loc-hit" data-loc="liege_fish_market"/>
<rect x="530" y="400" width="82" height="54" class="loc-hit" data-loc="liege_pastry_stand"/>
<rect x="388" y="476" width="124" height="42" class="loc-hit" data-loc="liege_dock_entrance_arch"/>
<rect x="638" y="388" width="84" height="142" class="loc-hit" data-loc="liege_near_pier"/>
<rect x="428" y="348" width="104" height="182" class="loc-hit" data-loc="liege_middle_pier"/>
<rect x="158" y="428" width="114" height="102" class="loc-hit" data-loc="liege_far_pier"/>
<ellipse cx="215" cy="292" rx="52" ry="22" class="loc-hit" data-loc="liege_hounds_dream_berth"/>
<rect x="166" y="596" width="98" height="66" class="loc-hit" data-loc="liege_buried_gate_chamber"/>
</svg>

<div id="tip"></div>

<div class="legend">
  <div class="li"><div class="ld" style="background:#204820;border-color:#40a040"></div>Ally / Foundation</div>
  <div class="li"><div class="ld" style="background:#481010;border-color:#c03030"></div>Threat / Acme</div>
  <div class="li"><div class="ld" style="background:#303010;border-color:#909030"></div>Neutral / Authority</div>
  <div class="li"><div class="ld" style="background:#202030;border-color:#6060a0"></div>Unknown</div>
  <div class="li"><div class="ld" style="background:#282010;border-color:#706040"></div>Background</div>
</div>
</div>

<script src="static/js/map.js"></script>
</body>
